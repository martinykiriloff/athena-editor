name: CI

# Manual only (Actions → CI → Run workflow). Builds run for releases, via
# release.yml on `v*` tags — not on every push. The test suite also needs a
# logged-in desktop session (windows, FSEvents) that hosted runners lack:
# on push it never finished, hanging until the job timeout. Run the tests
# locally with `make test` before tagging.
on:
  workflow_dispatch:

# A newer push to the same branch supersedes a queued or running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: make build-debug

      - name: Build (release)
        run: make build-release

      - name: Run tests
        run: make test
