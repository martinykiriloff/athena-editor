name: Release

on:
  push:
    tags:
      - 'v*'          # triggers on v1.1.0, v2.0.0, etc.
  # Re-run a release for an existing tag (Actions → Release → Run workflow)
  # when a run failed for reasons outside the code, e.g. no macOS runner
  # picked the job up — no need to move or recreate the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v2026.10
        required: true

# One release run per tag; a newer run for the same tag replaces a stuck one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-15
    # A clean release build takes ~7 minutes; fail a hung one instead of
    # holding the runner for the 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create the GitHub Release
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The updater compares this version with the release tag; a mismatch
      # would publish a build that keeps offering itself as an update.
      - name: Check Info.plist version matches the tag
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" XcodeConfig/Info.plist)
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Info.plist version $VERSION does not match tag $RELEASE_TAG"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          APP=Athena.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp .build/release/Athena               "$APP/Contents/MacOS/Athena"
          cp XcodeConfig/Info.plist              "$APP/Contents/Info.plist"
          cp XcodeConfig/AppIcon.icns            "$APP/Contents/Resources/AppIcon.icns"
          cp XcodeConfig/Athena.entitlements     "$APP/Contents/Resources/Athena.entitlements"

      - name: Zip
        run: zip -r Athena.zip Athena.app

      # The in-app updater refuses to install a release without this file.
      - name: Checksum
        run: shasum -a 256 Athena.zip > Athena.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            Athena.zip
            Athena.zip.sha256
          generate_release_notes: true
